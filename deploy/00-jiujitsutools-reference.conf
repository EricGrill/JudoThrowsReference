# Dedicated override, loaded before the legacy microsite definitions.
# The old service continues serving the existing training tools.
# Preserve the shared server's existing default: its first virtual host uses
# the BJJChat certificate and redirects unmatched hosts to the BJJChat apex.
server {
    listen 80 default_server;
    listen 443 ssl default_server;
    http2 on;
    server_name "";
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    return 301 https://bjjchat.com$request_uri;
}

server {
    listen 80;
    server_name jiujitsutools.com www.jiujitsutools.com;
    location / {
        return 301 https://jiujitsutools.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.jiujitsutools.com;
    ssl_certificate /etc/nginx/certs/jiujitsutools.crt;
    ssl_certificate_key /etc/nginx/certs/jiujitsutools.key;
    return 301 https://jiujitsutools.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name jiujitsutools.com;
    ssl_certificate /etc/nginx/certs/jiujitsutools.crt;
    ssl_certificate_key /etc/nginx/certs/jiujitsutools.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/search {
        limit_req zone=api_limit burst=20 nodelay;
        limit_req_status 429;
        set $reference_upstream http://jiujitsu-reference:7100;
        proxy_pass $reference_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 18s;
    }

    # Preserve bookmarked utilities and their Next.js resources.
    location ~ ^/(belt-calculator|competition-weight|training-timer|gi-size-calculator|blog|_next)(/|$) {
        set $legacy_tools_upstream http://jiujitsutools:3003;
        proxy_pass $legacy_tools_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        set $reference_upstream http://jiujitsu-reference:7100;
        proxy_pass $reference_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
